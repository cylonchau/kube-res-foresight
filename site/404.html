<script>(()=>{let mode='auto';try{const saved=localStorage.getItem('kube-resource-fcst-theme');if(['auto','light','dark'].includes(saved))mode=saved}catch{}const system=matchMedia('(prefers-color-scheme: light)');const apply=()=>{document.documentElement.dataset.theme=mode==='light'||(mode==='auto'&&system.matches)?'light':'dark'};system.addEventListener('change',()=>{if(mode==='auto')apply()});apply()})();</script>
<style>:root{color-scheme:dark;--bg:#0b1116;--text:#e7efee;--accent:#a3efc6}@media(prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:light;--bg:#f6f9f8;--text:#192f28;--accent:#176548}}:root[data-theme=light]{color-scheme:light;--bg:#f6f9f8;--text:#192f28;--accent:#176548}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.8 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{padding:24px;text-align:center}h1{font-size:60px;color:var(--accent);margin:0}a{color:var(--accent)}</style></head>

<script>(()=>{let saved;try{saved=localStorage.getItem('kube-resource-fcst-language')}catch{}const requested=new URL(location.href).searchParams.get('lang');const language=requested==='zh'||requested==='en'?requested:saved||((navigator.languages?.[0]||navigator.language||'en').toLowerCase().startsWith('zh')?'zh':'en');const home=document.getElementById('home');if(language==='en'){document.documentElement.lang='en';document.title='Page not found · kube-resource-fcst';document.getElementById('heading').textContent='Page not found.';document.getElementById('message').textContent='This page may have moved. Explore from the homepage.';home.textContent='Back to kube-resource-fcst →'}const target=new URL(home.href);if(language==='en')target.pathname=target.pathname.replace(/\/$/,'')+'/en/';target.searchParams.set('lang',language);home.href=target.href})();</script></body></html>
