<svg xmlns="http://www.w3.org/2000/svg" class="architecture-graphic" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="architecture-pod-calc-zh-title architecture-pod-calc-zh-description"><title id="architecture-pod-calc-zh-title">单 Pod Requests 与 Limits 的算法</title><desc id="architecture-pod-calc-zh-description">Requests 由持续使用量除以目标占比得到，Limits 由原始 P99 乘以系数得到。</desc><style>.architecture-graphic{--dg-bg:#fbfdff;--dg-panel:#f1f5fb;--dg-ink:#172c4a;--dg-muted:#536781;--dg-core:#e5efff;--dg-border:#87a9de;--dg-data:#416db1;--dg-write:#197d79;--dg-optional:#8762a9;--dg-exec:#e1f5f0;--dg-store:#fff0d5;--dg-service:#f1eafa;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){.architecture-graphic{--dg-bg:#101622;--dg-panel:#172336;--dg-ink:#e5ebf5;--dg-muted:#a8bad2;--dg-core:#203957;--dg-border:#5c7fab;--dg-data:#8fb7ff;--dg-write:#6dd1c2;--dg-optional:#c2a1e1;--dg-exec:#173e3d;--dg-store:#413725;--dg-service:#352b45}}
.architecture-graphic .dg-background{fill:var(--dg-bg)}.architecture-graphic .dg-group{fill:var(--dg-panel);stroke:var(--dg-border);stroke-width:1.5}.architecture-graphic .dg-box rect{fill:var(--dg-core);stroke:var(--dg-border);stroke-width:1.8}.architecture-graphic .dg-exec rect{fill:var(--dg-exec);stroke:var(--dg-write)}.architecture-graphic .dg-store rect{fill:var(--dg-store)}.architecture-graphic .dg-optional rect{fill:var(--dg-service);stroke:var(--dg-optional);stroke-dasharray:6 4}.architecture-graphic .dg-title{font-size:18px;font-weight:650;fill:var(--dg-ink)}.architecture-graphic .dg-note{font-size:14px;font-weight:450;fill:var(--dg-muted)}.architecture-graphic .dg-edge{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.architecture-graphic .dg-data{stroke:var(--dg-data)}.architecture-graphic .dg-write{stroke:var(--dg-write)}.architecture-graphic .dg-edge.dg-optional{stroke:var(--dg-optional);stroke-dasharray:6 5}.architecture-graphic{--dg-normal:#4f8fe8;--dg-high:#ef7a2d}.architecture-graphic .dg-cell{stroke:none}.architecture-graphic .dg-bar{fill:var(--dg-normal);opacity:.55}.architecture-graphic .dg-bar-high{fill:var(--dg-high);opacity:.9}.architecture-graphic .dg-outline{fill:none;stroke:var(--dg-high);stroke-width:2}.architecture-graphic .dg-tick{font-size:12px;fill:var(--dg-muted)}</style><defs><marker id="architecture-pod-calc-zh-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-data)"/></marker><marker id="architecture-pod-calc-zh-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-write)"/></marker><marker id="architecture-pod-calc-zh-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-optional)"/></marker></defs><rect class="dg-background" width="1080" height="700" rx="12"/><rect class="dg-group" x="30" y="20" width="500" height="640" rx="15"/><rect class="dg-group" x="560" y="20" width="490" height="640" rx="15"/><polyline class="dg-edge dg-data" points="280,140 280,180" marker-end="url(#architecture-pod-calc-zh-data)"/><polyline class="dg-edge dg-data" points="280,250 280,290" marker-end="url(#architecture-pod-calc-zh-data)"/><polyline class="dg-edge dg-data" points="280,350 280,390" marker-end="url(#architecture-pod-calc-zh-data)"/><polyline class="dg-edge dg-data" points="280,450 280,490" marker-end="url(#architecture-pod-calc-zh-data)"/><polyline class="dg-edge dg-data" points="280,560 280,590" marker-end="url(#architecture-pod-calc-zh-data)"/><polyline class="dg-edge dg-data" points="805,140 805,180" marker-end="url(#architecture-pod-calc-zh-data)"/><polyline class="dg-edge dg-data" points="805,250 805,290" marker-end="url(#architecture-pod-calc-zh-data)"/><polyline class="dg-edge dg-data" points="805,350 805,590" marker-end="url(#architecture-pod-calc-zh-data)"/><polyline class="dg-edge dg-write" points="500,617 530,617 530,320 590,320" marker-end="url(#architecture-pod-calc-zh-write)"/><text class="dg-title" x="50" y="49" text-anchor="start">Requests · 持续使用量</text><text class="dg-title" x="580" y="49" text-anchor="start">Limits · 原始峰值</text><g class="dg-box dg-core"><rect x="60" y="70" width="440" height="70" rx="10"/><text class="dg-title" x="280.0" y="100.0" text-anchor="middle">P90 · P95 · P99 持续使用量</text><text class="dg-note" x="280.0" y="125.0" text-anchor="middle">单 Pod，每点取前 30 分钟均值</text></g><g class="dg-box dg-core"><rect x="60" y="180" width="440" height="70" rx="10"/><text class="dg-title" x="280.0" y="210.0" text-anchor="middle">各除以自己的目标占比</text><text class="dg-note" x="280.0" y="235.0" text-anchor="middle">默认 80% · 85% · 110%</text></g><g class="dg-box dg-core"><rect x="60" y="290" width="440" height="60" rx="10"/><text class="dg-title" x="280.0" y="326.0" text-anchor="middle">取最大的一个</text></g><g class="dg-box dg-core"><rect x="60" y="390" width="440" height="60" rx="10"/><text class="dg-title" x="280.0" y="415.0" text-anchor="middle">× (1 + Requests 余量)</text><text class="dg-note" x="280.0" y="440.0" text-anchor="middle">可选，默认不加</text></g><g class="dg-box dg-core"><rect x="60" y="490" width="440" height="70" rx="10"/><text class="dg-title" x="280.0" y="520.0" text-anchor="middle">按规格向上取整</text><text class="dg-note" x="280.0" y="545.0" text-anchor="middle">CPU 50 mCPU · 内存 64 MiB</text></g><g class="dg-box dg-exec"><rect x="60" y="590" width="440" height="55" rx="10"/><text class="dg-title" x="280.0" y="623.5" text-anchor="middle">推荐 Requests</text></g><g class="dg-box dg-core"><rect x="590" y="70" width="430" height="70" rx="10"/><text class="dg-title" x="805.0" y="100.0" text-anchor="middle">原始 P99</text><text class="dg-note" x="805.0" y="125.0" text-anchor="middle">单 Pod，不做持续处理</text></g><g class="dg-box dg-core"><rect x="590" y="180" width="430" height="70" rx="10"/><text class="dg-title" x="805.0" y="210.0" text-anchor="middle">× Limits 系数</text><text class="dg-note" x="805.0" y="235.0" text-anchor="middle">默认 120%（即 P99 × 1.2）</text></g><g class="dg-box dg-core"><rect x="590" y="290" width="430" height="60" rx="10"/><text class="dg-title" x="805.0" y="326.0" text-anchor="middle">max(推荐 Requests, 上一步)</text></g><g class="dg-box dg-exec"><rect x="590" y="590" width="430" height="55" rx="10"/><text class="dg-title" x="805.0" y="623.5" text-anchor="middle">推荐 Limits</text></g><text class="dg-note" x="830" y="440" text-anchor="start">Limits 不低于 Requests</text><text class="dg-note" x="830" y="470" text-anchor="start">例：5.25 GiB × 120% = 6.3 GiB</text><text class="dg-note" x="830" y="498" text-anchor="start">max(6.06, 6.3) = 6.3 GiB</text><text class="dg-note" x="280" y="682" text-anchor="middle">例：5.11 GiB ÷ 85% ≈ 6.01 GiB → 6.06 GiB</text></svg>