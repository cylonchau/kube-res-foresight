<svg xmlns="http://www.w3.org/2000/svg" class="architecture-graphic" width="1080" height="750" viewBox="0 0 1080 750" role="img" aria-labelledby="architecture-replica-calc-en-title architecture-replica-calc-en-description"><title id="architecture-replica-calc-en-title">How the recommended replicas are worked out</title><desc id="architecture-replica-calc-en-description">CPU and memory each ask for a count; the larger is taken, then bounds and protections.</desc><style>.architecture-graphic{--dg-bg:#fbfdff;--dg-panel:#f1f5fb;--dg-ink:#172c4a;--dg-muted:#536781;--dg-core:#e5efff;--dg-border:#87a9de;--dg-data:#416db1;--dg-write:#197d79;--dg-optional:#8762a9;--dg-exec:#e1f5f0;--dg-store:#fff0d5;--dg-service:#f1eafa;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){.architecture-graphic{--dg-bg:#101622;--dg-panel:#172336;--dg-ink:#e5ebf5;--dg-muted:#a8bad2;--dg-core:#203957;--dg-border:#5c7fab;--dg-data:#8fb7ff;--dg-write:#6dd1c2;--dg-optional:#c2a1e1;--dg-exec:#173e3d;--dg-store:#413725;--dg-service:#352b45}}
.architecture-graphic .dg-background{fill:var(--dg-bg)}.architecture-graphic .dg-group{fill:var(--dg-panel);stroke:var(--dg-border);stroke-width:1.5}.architecture-graphic .dg-box rect{fill:var(--dg-core);stroke:var(--dg-border);stroke-width:1.8}.architecture-graphic .dg-exec rect{fill:var(--dg-exec);stroke:var(--dg-write)}.architecture-graphic .dg-store rect{fill:var(--dg-store)}.architecture-graphic .dg-optional rect{fill:var(--dg-service);stroke:var(--dg-optional);stroke-dasharray:6 4}.architecture-graphic .dg-title{font-size:18px;font-weight:650;fill:var(--dg-ink)}.architecture-graphic .dg-note{font-size:14px;font-weight:450;fill:var(--dg-muted)}.architecture-graphic .dg-edge{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.architecture-graphic .dg-data{stroke:var(--dg-data)}.architecture-graphic .dg-write{stroke:var(--dg-write)}.architecture-graphic .dg-edge.dg-optional{stroke:var(--dg-optional);stroke-dasharray:6 5}.architecture-graphic{--dg-normal:#4f8fe8;--dg-high:#ef7a2d}.architecture-graphic .dg-cell{stroke:none}.architecture-graphic .dg-bar{fill:var(--dg-normal);opacity:.55}.architecture-graphic .dg-bar-high{fill:var(--dg-high);opacity:.9}.architecture-graphic .dg-outline{fill:none;stroke:var(--dg-high);stroke-width:2}.architecture-graphic .dg-tick{font-size:12px;fill:var(--dg-muted)}</style><defs><marker id="architecture-replica-calc-en-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-data)"/></marker><marker id="architecture-replica-calc-en-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-write)"/></marker><marker id="architecture-replica-calc-en-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-optional)"/></marker></defs><rect class="dg-background" width="1080" height="750" rx="12"/><polyline class="dg-edge dg-data" points="260,90 260,110 450,110 450,130" marker-end="url(#architecture-replica-calc-en-data)"/><polyline class="dg-edge dg-data" points="820,90 820,110 630,110 630,130" marker-end="url(#architecture-replica-calc-en-data)"/><polyline class="dg-edge dg-data" points="540,200 540,222 190,222 190,245" marker-end="url(#architecture-replica-calc-en-data)"/><polyline class="dg-edge dg-data" points="540,200 540,245" marker-end="url(#architecture-replica-calc-en-data)"/><polyline class="dg-edge dg-data" points="540,222 890,222 890,245" marker-end="url(#architecture-replica-calc-en-data)"/><polyline class="dg-edge dg-data" points="190,315 190,338 540,338 540,360" marker-end="url(#architecture-replica-calc-en-data)"/><polyline class="dg-edge dg-data" points="540,315 540,360" marker-end="url(#architecture-replica-calc-en-data)"/><polyline class="dg-edge dg-data" points="890,315 890,338 540,338" marker-end="url(#architecture-replica-calc-en-data)"/><polyline class="dg-edge dg-data" points="540,425 540,465" marker-end="url(#architecture-replica-calc-en-data)"/><polyline class="dg-edge dg-data" points="540,530 540,570" marker-end="url(#architecture-replica-calc-en-data)"/><polyline class="dg-edge dg-optional" points="830,497 780,497" marker-end="url(#architecture-replica-calc-en-optional)"/><polyline class="dg-edge dg-write" points="780,607 830,607" marker-end="url(#architecture-replica-calc-en-write)"/><g class="dg-box dg-core"><rect x="40" y="20" width="440" height="70" rx="10"/><text class="dg-title" x="260.0" y="50.0" text-anchor="middle">Use of all the replicas</text><text class="dg-note" x="260.0" y="75.0" text-anchor="middle">Sustained P90 · P95 · P99</text></g><g class="dg-box dg-exec"><rect x="600" y="20" width="440" height="70" rx="10"/><text class="dg-title" x="820.0" y="50.0" text-anchor="middle">Requests of a Pod and target share</text><text class="dg-note" x="820.0" y="75.0" text-anchor="middle">The Pod template from Kubernetes</text></g><g class="dg-box dg-core"><rect x="300" y="130" width="480" height="70" rx="10"/><text class="dg-title" x="540.0" y="171.0" text-anchor="middle">Each percentile: total / (Requests x share)</text></g><g class="dg-box dg-core"><rect x="40" y="245" width="300" height="70" rx="10"/><text class="dg-title" x="190.0" y="275.0" text-anchor="middle">CPU asks for</text><text class="dg-note" x="190.0" y="300.0" text-anchor="middle">Largest of three, rounded up</text></g><g class="dg-box dg-core"><rect x="390" y="245" width="300" height="70" rx="10"/><text class="dg-title" x="540.0" y="275.0" text-anchor="middle">Memory asks for</text><text class="dg-note" x="540.0" y="300.0" text-anchor="middle">The same</text></g><g class="dg-box dg-core"><rect x="740" y="245" width="300" height="70" rx="10"/><text class="dg-title" x="890.0" y="275.0" text-anchor="middle">Limits guard</text><text class="dg-note" x="890.0" y="300.0" text-anchor="middle">P99 total / (Limits x 90%)</text></g><g class="dg-box dg-core"><rect x="300" y="360" width="480" height="65" rx="10"/><text class="dg-title" x="540.0" y="398.5" text-anchor="middle">The larger, at least 1</text></g><g class="dg-box dg-core"><rect x="300" y="465" width="480" height="65" rx="10"/><text class="dg-title" x="540.0" y="503.5" text-anchor="middle">Least and most replicas of the module</text></g><g class="dg-box dg-optional"><rect x="830" y="465" width="210" height="65" rx="10"/><text class="dg-title" x="935.0" y="492.5" text-anchor="middle">OOM or throttling</text><text class="dg-note" x="935.0" y="517.5" text-anchor="middle">No scale-in</text></g><g class="dg-box dg-core"><rect x="300" y="570" width="480" height="75" rx="10"/><text class="dg-title" x="540.0" y="602.5" text-anchor="middle">Recommended replicas</text><text class="dg-note" x="540.0" y="627.5" text-anchor="middle">Pace not included</text></g><g class="dg-box dg-exec"><rect x="830" y="570" width="210" height="75" rx="10"/><text class="dg-title" x="935.0" y="602.5" text-anchor="middle">This action reaches</text><text class="dg-note" x="935.0" y="627.5" text-anchor="middle">At most N at once</text></g><text class="dg-note" x="540" y="692" text-anchor="middle">e.g. memory 60.71 GiB / (6 GiB x 85%) = 11.9 -&gt; 12</text><text class="dg-note" x="540" y="720" text-anchor="middle">When CPU alone needs 9 to 11, memory still sets 12</text></svg>