<svg xmlns="http://www.w3.org/2000/svg" class="architecture-graphic" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="architecture-module-map-zh-title architecture-module-map-zh-description"><title id="architecture-module-map-zh-title">模块配置与它控制的内容</title><desc id="architecture-module-map-zh-description">模块编辑页的五组配置各自决定大盘与执行里的哪一部分。</desc><style>.architecture-graphic{--dg-bg:#fbfdff;--dg-panel:#f1f5fb;--dg-ink:#172c4a;--dg-muted:#536781;--dg-core:#e5efff;--dg-border:#87a9de;--dg-data:#416db1;--dg-write:#197d79;--dg-optional:#8762a9;--dg-exec:#e1f5f0;--dg-store:#fff0d5;--dg-service:#f1eafa;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){.architecture-graphic{--dg-bg:#101622;--dg-panel:#172336;--dg-ink:#e5ebf5;--dg-muted:#a8bad2;--dg-core:#203957;--dg-border:#5c7fab;--dg-data:#8fb7ff;--dg-write:#6dd1c2;--dg-optional:#c2a1e1;--dg-exec:#173e3d;--dg-store:#413725;--dg-service:#352b45}}
.architecture-graphic .dg-background{fill:var(--dg-bg)}.architecture-graphic .dg-group{fill:var(--dg-panel);stroke:var(--dg-border);stroke-width:1.5}.architecture-graphic .dg-box rect{fill:var(--dg-core);stroke:var(--dg-border);stroke-width:1.8}.architecture-graphic .dg-exec rect{fill:var(--dg-exec);stroke:var(--dg-write)}.architecture-graphic .dg-store rect{fill:var(--dg-store)}.architecture-graphic .dg-optional rect{fill:var(--dg-service);stroke:var(--dg-optional);stroke-dasharray:6 4}.architecture-graphic .dg-title{font-size:18px;font-weight:650;fill:var(--dg-ink)}.architecture-graphic .dg-note{font-size:14px;font-weight:450;fill:var(--dg-muted)}.architecture-graphic .dg-edge{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.architecture-graphic .dg-data{stroke:var(--dg-data)}.architecture-graphic .dg-write{stroke:var(--dg-write)}.architecture-graphic .dg-edge.dg-optional{stroke:var(--dg-optional);stroke-dasharray:6 5}.architecture-graphic{--dg-normal:#4f8fe8;--dg-high:#ef7a2d}.architecture-graphic .dg-cell{stroke:none}.architecture-graphic .dg-bar{fill:var(--dg-normal);opacity:.55}.architecture-graphic .dg-bar-high{fill:var(--dg-high);opacity:.9}.architecture-graphic .dg-outline{fill:none;stroke:var(--dg-high);stroke-width:2}.architecture-graphic .dg-tick{font-size:12px;fill:var(--dg-muted)}</style><defs><marker id="architecture-module-map-zh-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-data)"/></marker><marker id="architecture-module-map-zh-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-write)"/></marker><marker id="architecture-module-map-zh-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-optional)"/></marker></defs><rect class="dg-background" width="1080" height="640" rx="12"/><rect class="dg-group" x="20" y="30" width="340" height="570" rx="15"/><rect class="dg-group" x="780" y="30" width="280" height="570" rx="15"/><polyline class="dg-edge dg-data" points="340,118 410,118" marker-end="url(#architecture-module-map-zh-data)"/><polyline class="dg-edge dg-data" points="730,118 780,118" marker-end="url(#architecture-module-map-zh-data)"/><polyline class="dg-edge dg-data" points="340,218 410,218" marker-end="url(#architecture-module-map-zh-data)"/><polyline class="dg-edge dg-data" points="730,218 780,218" marker-end="url(#architecture-module-map-zh-data)"/><polyline class="dg-edge dg-data" points="340,318 410,318" marker-end="url(#architecture-module-map-zh-data)"/><polyline class="dg-edge dg-data" points="730,318 780,318" marker-end="url(#architecture-module-map-zh-data)"/><polyline class="dg-edge dg-data" points="340,418 410,418" marker-end="url(#architecture-module-map-zh-data)"/><polyline class="dg-edge dg-data" points="730,418 780,418" marker-end="url(#architecture-module-map-zh-data)"/><polyline class="dg-edge dg-data" points="340,518 410,518" marker-end="url(#architecture-module-map-zh-data)"/><polyline class="dg-edge dg-data" points="730,518 780,518" marker-end="url(#architecture-module-map-zh-data)"/><text class="dg-title" x="40" y="59" text-anchor="start">模块编辑页</text><text class="dg-title" x="800" y="59" text-anchor="start">结果与执行</text><g class="dg-box dg-core"><rect x="40" y="80" width="300" height="76" rx="10"/><text class="dg-title" x="190.0" y="113.0" text-anchor="middle">基本与指标来源</text><text class="dg-note" x="190.0" y="138.0" text-anchor="middle">工作负载 · 数据源 · 指标模板</text></g><g class="dg-box dg-core"><rect x="410" y="80" width="320" height="76" rx="10"/><text class="dg-title" x="570.0" y="113.0" text-anchor="middle">读什么数据</text><text class="dg-note" x="570.0" y="138.0" text-anchor="middle">使用量 · Requests · Limits 的来源</text></g><g class="dg-box dg-core"><rect x="40" y="180" width="300" height="76" rx="10"/><text class="dg-title" x="190.0" y="213.0" text-anchor="middle">计算参数</text><text class="dg-note" x="190.0" y="238.0" text-anchor="middle">容量 · 推荐系数 · OOM · JVM</text></g><g class="dg-box dg-core"><rect x="410" y="180" width="320" height="76" rx="10"/><text class="dg-title" x="570.0" y="213.0" text-anchor="middle">怎么算</text><text class="dg-note" x="570.0" y="238.0" text-anchor="middle">Requests · Limits · 副本数的算法</text></g><g class="dg-box dg-core"><rect x="40" y="280" width="300" height="76" rx="10"/><text class="dg-title" x="190.0" y="313.0" text-anchor="middle">安全边界</text><text class="dg-note" x="190.0" y="338.0" text-anchor="middle">副本上下限 · 节奏 · 降级值</text></g><g class="dg-box dg-core"><rect x="410" y="280" width="320" height="76" rx="10"/><text class="dg-title" x="570.0" y="313.0" text-anchor="middle">不能越过的范围</text><text class="dg-note" x="570.0" y="338.0" text-anchor="middle">推荐值最终要落在的区间</text></g><g class="dg-box dg-core"><rect x="40" y="380" width="300" height="76" rx="10"/><text class="dg-title" x="190.0" y="413.0" text-anchor="middle">模块策略</text><text class="dg-note" x="190.0" y="438.0" text-anchor="middle">预测 · 时间周期 · 触发 · 固定</text></g><g class="dg-box dg-core"><rect x="410" y="380" width="320" height="76" rx="10"/><text class="dg-title" x="570.0" y="413.0" text-anchor="middle">什么时候用什么</text><text class="dg-note" x="570.0" y="438.0" text-anchor="middle">副本数在不同时刻的来源</text></g><g class="dg-box dg-core"><rect x="40" y="480" width="300" height="76" rx="10"/><text class="dg-title" x="190.0" y="513.0" text-anchor="middle">运行模式</text><text class="dg-note" x="190.0" y="538.0" text-anchor="middle">Observe · Recommend · Admission · Auto</text></g><g class="dg-box dg-exec"><rect x="410" y="480" width="320" height="76" rx="10"/><text class="dg-title" x="570.0" y="513.0" text-anchor="middle">允许做什么</text><text class="dg-note" x="570.0" y="538.0" text-anchor="middle">只看、推荐、准入还是自动</text></g><text class="dg-title" x="920" y="330" text-anchor="middle">资源大盘</text><text class="dg-title" x="920" y="365" text-anchor="middle">推荐快照</text><text class="dg-title" x="920" y="400" text-anchor="middle">准入 · Operator</text><text class="dg-note" x="540" y="628" text-anchor="middle">每一项配置都能在模块列表的“参数”窗口里按分组查看生效值</text></svg>