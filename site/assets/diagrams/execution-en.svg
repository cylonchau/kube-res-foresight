<svg xmlns="http://www.w3.org/2000/svg" class="architecture-graphic" width="1080" height="735" viewBox="0 0 1080 735" role="img" aria-labelledby="architecture-execution-en-title architecture-execution-en-description"><title id="architecture-execution-en-title">Resource and replica execution</title><desc id="architecture-execution-en-description">Admission configures new Pods; the Operator separately controls replicas.</desc><style>.architecture-graphic{--dg-bg:#fbfdff;--dg-panel:#f1f5fb;--dg-ink:#172c4a;--dg-muted:#536781;--dg-core:#e5efff;--dg-border:#87a9de;--dg-data:#416db1;--dg-write:#197d79;--dg-optional:#8762a9;--dg-exec:#e1f5f0;--dg-store:#fff0d5;--dg-service:#f1eafa;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){.architecture-graphic{--dg-bg:#101622;--dg-panel:#172336;--dg-ink:#e5ebf5;--dg-muted:#a8bad2;--dg-core:#203957;--dg-border:#5c7fab;--dg-data:#8fb7ff;--dg-write:#6dd1c2;--dg-optional:#c2a1e1;--dg-exec:#173e3d;--dg-store:#413725;--dg-service:#352b45}}
.architecture-graphic .dg-background{fill:var(--dg-bg)}.architecture-graphic .dg-group{fill:var(--dg-panel);stroke:var(--dg-border);stroke-width:1.5}.architecture-graphic .dg-box rect{fill:var(--dg-core);stroke:var(--dg-border);stroke-width:1.8}.architecture-graphic .dg-exec rect{fill:var(--dg-exec);stroke:var(--dg-write)}.architecture-graphic .dg-store rect{fill:var(--dg-store)}.architecture-graphic .dg-optional rect{fill:var(--dg-service);stroke:var(--dg-optional);stroke-dasharray:6 4}.architecture-graphic .dg-title{font-size:18px;font-weight:650;fill:var(--dg-ink)}.architecture-graphic .dg-note{font-size:14px;font-weight:450;fill:var(--dg-muted)}.architecture-graphic .dg-edge{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.architecture-graphic .dg-data{stroke:var(--dg-data)}.architecture-graphic .dg-write{stroke:var(--dg-write)}.architecture-graphic .dg-edge.dg-optional{stroke:var(--dg-optional);stroke-dasharray:6 5}</style><defs><marker id="architecture-execution-en-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-data)"/></marker><marker id="architecture-execution-en-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-write)"/></marker><marker id="architecture-execution-en-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-optional)"/></marker></defs><rect class="dg-background" width="1080" height="735" rx="12"/><rect class="dg-group" x="20" y="170" width="495" height="355" rx="15"/><rect class="dg-group" x="565" y="170" width="495" height="355" rx="15"/><polyline class="dg-edge dg-data" points="410,62 35,62 35,372 90,372" marker-end="url(#architecture-execution-en-data)"/><polyline class="dg-edge dg-data" points="670,62 1045,62 1045,267 985,267" marker-end="url(#architecture-execution-en-data)"/><polyline class="dg-edge dg-data" points="260,300 260,340" marker-end="url(#architecture-execution-en-data)"/><polyline class="dg-edge dg-data" points="260,405 260,445" marker-end="url(#architecture-execution-en-data)"/><polyline class="dg-edge dg-data" points="815,300 815,340" marker-end="url(#architecture-execution-en-data)"/><polyline class="dg-edge dg-data" points="815,405 815,445" marker-end="url(#architecture-execution-en-data)"/><polyline class="dg-edge dg-write" points="260,510 260,637 410,637" marker-end="url(#architecture-execution-en-write)"/><polyline class="dg-edge dg-write" points="815,510 815,637 670,637" marker-end="url(#architecture-execution-en-write)"/><g class="dg-box dg-core"><rect x="410" y="20" width="260" height="85" rx="10"/><text class="dg-title" x="540.0" y="57.5" text-anchor="middle">Validated snapshot</text><text class="dg-note" x="540.0" y="82.5" text-anchor="middle">Freshness · version · authorization</text></g><text class="dg-title" x="40" y="199" text-anchor="start">Path 1 · resources of new Pods</text><text class="dg-title" x="585" y="199" text-anchor="start">Path 2 · workload replicas</text><g class="dg-box dg-exec"><rect x="90" y="235" width="340" height="65" rx="10"/><text class="dg-title" x="260.0" y="262.5" text-anchor="middle">Pod creation admission request</text><text class="dg-note" x="260.0" y="287.5" text-anchor="middle">Kubernetes API Server</text></g><g class="dg-box dg-core"><rect x="90" y="340" width="340" height="65" rx="10"/><text class="dg-title" x="260.0" y="367.5" text-anchor="middle">Kyverno queries resource advice</text><text class="dg-note" x="260.0" y="392.5" text-anchor="middle">Snapshot only, no model inference</text></g><g class="dg-box dg-exec"><rect x="90" y="445" width="340" height="65" rx="10"/><text class="dg-title" x="260.0" y="472.5" text-anchor="middle">Apply requests / limits</text><text class="dg-note" x="260.0" y="497.5" text-anchor="middle">Subject to module policy</text></g><g class="dg-box dg-core"><rect x="645" y="235" width="340" height="65" rx="10"/><text class="dg-title" x="815.0" y="262.5" text-anchor="middle">Operator reads advice</text><text class="dg-note" x="815.0" y="287.5" text-anchor="middle">Platform provides target replicas</text></g><g class="dg-box dg-core"><rect x="645" y="340" width="340" height="65" rx="10"/><text class="dg-title" x="815.0" y="367.5" text-anchor="middle">Check execution rules</text><text class="dg-note" x="815.0" y="392.5" text-anchor="middle">Bounds · readiness · cooldown · step</text></g><g class="dg-box dg-exec"><rect x="645" y="445" width="340" height="65" rx="10"/><text class="dg-title" x="815.0" y="472.5" text-anchor="middle">Write replicas through Scale API</text><text class="dg-note" x="815.0" y="497.5" text-anchor="middle">One replica controller</text></g><g class="dg-box dg-exec"><rect x="410" y="600" width="260" height="75" rx="10"/><text class="dg-title" x="540.0" y="632.5" text-anchor="middle">Kubernetes outcomes</text><text class="dg-note" x="540.0" y="657.5" text-anchor="middle">Pod resources and Ready capacity</text></g><text class="dg-note" x="260" y="148" text-anchor="middle">Invalid advice preserves resources</text><text class="dg-note" x="815" y="148" text-anchor="middle">Outages use cache and recovery rules</text><text class="dg-note" x="540" y="713" text-anchor="middle">Authorize admission and scaling separately; no overlapping writes</text></svg>