<svg xmlns="http://www.w3.org/2000/svg" class="architecture-graphic" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="architecture-module-map-en-title architecture-module-map-en-description"><title id="architecture-module-map-en-title">Module settings and what they control</title><desc id="architecture-module-map-en-description">Each of the five groups of the module form decides one part of the dashboard and of execution.</desc><style>.architecture-graphic{--dg-bg:#fbfdff;--dg-panel:#f1f5fb;--dg-ink:#172c4a;--dg-muted:#536781;--dg-core:#e5efff;--dg-border:#87a9de;--dg-data:#416db1;--dg-write:#197d79;--dg-optional:#8762a9;--dg-exec:#e1f5f0;--dg-store:#fff0d5;--dg-service:#f1eafa;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){.architecture-graphic{--dg-bg:#101622;--dg-panel:#172336;--dg-ink:#e5ebf5;--dg-muted:#a8bad2;--dg-core:#203957;--dg-border:#5c7fab;--dg-data:#8fb7ff;--dg-write:#6dd1c2;--dg-optional:#c2a1e1;--dg-exec:#173e3d;--dg-store:#413725;--dg-service:#352b45}}
.architecture-graphic .dg-background{fill:var(--dg-bg)}.architecture-graphic .dg-group{fill:var(--dg-panel);stroke:var(--dg-border);stroke-width:1.5}.architecture-graphic .dg-box rect{fill:var(--dg-core);stroke:var(--dg-border);stroke-width:1.8}.architecture-graphic .dg-exec rect{fill:var(--dg-exec);stroke:var(--dg-write)}.architecture-graphic .dg-store rect{fill:var(--dg-store)}.architecture-graphic .dg-optional rect{fill:var(--dg-service);stroke:var(--dg-optional);stroke-dasharray:6 4}.architecture-graphic .dg-title{font-size:18px;font-weight:650;fill:var(--dg-ink)}.architecture-graphic .dg-note{font-size:14px;font-weight:450;fill:var(--dg-muted)}.architecture-graphic .dg-edge{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.architecture-graphic .dg-data{stroke:var(--dg-data)}.architecture-graphic .dg-write{stroke:var(--dg-write)}.architecture-graphic .dg-edge.dg-optional{stroke:var(--dg-optional);stroke-dasharray:6 5}.architecture-graphic{--dg-normal:#4f8fe8;--dg-high:#ef7a2d}.architecture-graphic .dg-cell{stroke:none}.architecture-graphic .dg-bar{fill:var(--dg-normal);opacity:.55}.architecture-graphic .dg-bar-high{fill:var(--dg-high);opacity:.9}.architecture-graphic .dg-outline{fill:none;stroke:var(--dg-high);stroke-width:2}.architecture-graphic .dg-tick{font-size:12px;fill:var(--dg-muted)}</style><defs><marker id="architecture-module-map-en-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-data)"/></marker><marker id="architecture-module-map-en-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-write)"/></marker><marker id="architecture-module-map-en-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-optional)"/></marker></defs><rect class="dg-background" width="1080" height="640" rx="12"/><rect class="dg-group" x="20" y="30" width="340" height="570" rx="15"/><rect class="dg-group" x="780" y="30" width="280" height="570" rx="15"/><polyline class="dg-edge dg-data" points="340,118 410,118" marker-end="url(#architecture-module-map-en-data)"/><polyline class="dg-edge dg-data" points="730,118 780,118" marker-end="url(#architecture-module-map-en-data)"/><polyline class="dg-edge dg-data" points="340,218 410,218" marker-end="url(#architecture-module-map-en-data)"/><polyline class="dg-edge dg-data" points="730,218 780,218" marker-end="url(#architecture-module-map-en-data)"/><polyline class="dg-edge dg-data" points="340,318 410,318" marker-end="url(#architecture-module-map-en-data)"/><polyline class="dg-edge dg-data" points="730,318 780,318" marker-end="url(#architecture-module-map-en-data)"/><polyline class="dg-edge dg-data" points="340,418 410,418" marker-end="url(#architecture-module-map-en-data)"/><polyline class="dg-edge dg-data" points="730,418 780,418" marker-end="url(#architecture-module-map-en-data)"/><polyline class="dg-edge dg-data" points="340,518 410,518" marker-end="url(#architecture-module-map-en-data)"/><polyline class="dg-edge dg-data" points="730,518 780,518" marker-end="url(#architecture-module-map-en-data)"/><text class="dg-title" x="40" y="59" text-anchor="start">Module form</text><text class="dg-title" x="800" y="59" text-anchor="start">Results and execution</text><g class="dg-box dg-core"><rect x="40" y="80" width="300" height="76" rx="10"/><text class="dg-title" x="190.0" y="113.0" text-anchor="middle">Workload and sources</text><text class="dg-note" x="190.0" y="138.0" text-anchor="middle">Workload · data sources · templates</text></g><g class="dg-box dg-core"><rect x="410" y="80" width="320" height="76" rx="10"/><text class="dg-title" x="570.0" y="113.0" text-anchor="middle">What data is read</text><text class="dg-note" x="570.0" y="138.0" text-anchor="middle">Where use, Requests and Limits come from</text></g><g class="dg-box dg-core"><rect x="40" y="180" width="300" height="76" rx="10"/><text class="dg-title" x="190.0" y="213.0" text-anchor="middle">Calculation</text><text class="dg-note" x="190.0" y="238.0" text-anchor="middle">Capacity · coefficients · OOM · JVM</text></g><g class="dg-box dg-core"><rect x="410" y="180" width="320" height="76" rx="10"/><text class="dg-title" x="570.0" y="213.0" text-anchor="middle">How it is worked out</text><text class="dg-note" x="570.0" y="238.0" text-anchor="middle">Requests · Limits · replica rules</text></g><g class="dg-box dg-core"><rect x="40" y="280" width="300" height="76" rx="10"/><text class="dg-title" x="190.0" y="313.0" text-anchor="middle">Safety bounds</text><text class="dg-note" x="190.0" y="338.0" text-anchor="middle">Replica bounds · pace · fallback</text></g><g class="dg-box dg-core"><rect x="410" y="280" width="320" height="76" rx="10"/><text class="dg-title" x="570.0" y="313.0" text-anchor="middle">What may not be crossed</text><text class="dg-note" x="570.0" y="338.0" text-anchor="middle">The range a result must end in</text></g><g class="dg-box dg-core"><rect x="40" y="380" width="300" height="76" rx="10"/><text class="dg-title" x="190.0" y="413.0" text-anchor="middle">Strategies</text><text class="dg-note" x="190.0" y="438.0" text-anchor="middle">Forecast · periods · triggers · fixed</text></g><g class="dg-box dg-core"><rect x="410" y="380" width="320" height="76" rx="10"/><text class="dg-title" x="570.0" y="413.0" text-anchor="middle">When to use which</text><text class="dg-note" x="570.0" y="438.0" text-anchor="middle">Where the replicas come from at each moment</text></g><g class="dg-box dg-core"><rect x="40" y="480" width="300" height="76" rx="10"/><text class="dg-title" x="190.0" y="513.0" text-anchor="middle">Mode</text><text class="dg-note" x="190.0" y="538.0" text-anchor="middle">Observe · Recommend · Admission · Auto</text></g><g class="dg-box dg-exec"><rect x="410" y="480" width="320" height="76" rx="10"/><text class="dg-title" x="570.0" y="513.0" text-anchor="middle">What is allowed</text><text class="dg-note" x="570.0" y="538.0" text-anchor="middle">Watch, advise, admit or act</text></g><text class="dg-title" x="920" y="330" text-anchor="middle">Resource dashboard</text><text class="dg-title" x="920" y="365" text-anchor="middle">Recommendation snapshot</text><text class="dg-title" x="920" y="400" text-anchor="middle">Admission · Operator</text><text class="dg-note" x="540" y="628" text-anchor="middle">Every setting can be read by group in the Parameters window of the module list</text></svg>