<svg xmlns="http://www.w3.org/2000/svg" class="architecture-graphic" width="1080" height="940" viewBox="0 0 1080 940" role="img" aria-labelledby="architecture-overview-zh-title architecture-overview-zh-description"><title id="architecture-overview-zh-title">系统总览</title><desc id="architecture-overview-zh-description">指标、平台、推荐、执行与实测反馈之间的关系。</desc><style>.architecture-graphic{--dg-bg:#fbfdff;--dg-panel:#f1f5fb;--dg-ink:#172c4a;--dg-muted:#536781;--dg-core:#e5efff;--dg-border:#87a9de;--dg-data:#416db1;--dg-write:#197d79;--dg-optional:#8762a9;--dg-exec:#e1f5f0;--dg-store:#fff0d5;--dg-service:#f1eafa;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){.architecture-graphic{--dg-bg:#101622;--dg-panel:#172336;--dg-ink:#e5ebf5;--dg-muted:#a8bad2;--dg-core:#203957;--dg-border:#5c7fab;--dg-data:#8fb7ff;--dg-write:#6dd1c2;--dg-optional:#c2a1e1;--dg-exec:#173e3d;--dg-store:#413725;--dg-service:#352b45}}
.architecture-graphic .dg-background{fill:var(--dg-bg)}.architecture-graphic .dg-group{fill:var(--dg-panel);stroke:var(--dg-border);stroke-width:1.5}.architecture-graphic .dg-box rect{fill:var(--dg-core);stroke:var(--dg-border);stroke-width:1.8}.architecture-graphic .dg-exec rect{fill:var(--dg-exec);stroke:var(--dg-write)}.architecture-graphic .dg-store rect{fill:var(--dg-store)}.architecture-graphic .dg-optional rect{fill:var(--dg-service);stroke:var(--dg-optional);stroke-dasharray:6 4}.architecture-graphic .dg-title{font-size:18px;font-weight:650;fill:var(--dg-ink)}.architecture-graphic .dg-note{font-size:14px;font-weight:450;fill:var(--dg-muted)}.architecture-graphic .dg-edge{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.architecture-graphic .dg-data{stroke:var(--dg-data)}.architecture-graphic .dg-write{stroke:var(--dg-write)}.architecture-graphic .dg-edge.dg-optional{stroke:var(--dg-optional);stroke-dasharray:6 5}</style><defs><marker id="architecture-overview-zh-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-data)"/></marker><marker id="architecture-overview-zh-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-write)"/></marker><marker id="architecture-overview-zh-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-optional)"/></marker></defs><rect class="dg-background" width="1080" height="940" rx="12"/><rect class="dg-group" x="250" y="150" width="550" height="450" rx="15"/><polyline class="dg-edge dg-data" points="515,100 515,150" marker-end="url(#architecture-overview-zh-data)"/><polyline class="dg-edge dg-optional" points="925,100 925,125 700,125 700,150" marker-end="url(#architecture-overview-zh-optional)"/><polyline class="dg-edge dg-data" points="220,265 275,265 275,247 325,247" ma