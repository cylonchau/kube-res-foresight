<svg xmlns="http://www.w3.org/2000/svg" class="architecture-graphic" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="architecture-dashboard-flow-zh-title architecture-dashboard-flow-zh-description"><title id="architecture-dashboard-flow-zh-title">资源大盘的数据与结果</title><desc id="architecture-dashboard-flow-zh-description">使用量来自 Prometheus，Pod 配置与副本数来自 Kubernetes，大盘给出两种调整方案。</desc><style>.architecture-graphic{--dg-bg:#fbfdff;--dg-panel:#f1f5fb;--dg-ink:#172c4a;--dg-muted:#536781;--dg-core:#e5efff;--dg-border:#87a9de;--dg-data:#416db1;--dg-write:#197d79;--dg-optional:#8762a9;--dg-exec:#e1f5f0;--dg-store:#fff0d5;--dg-service:#f1eafa;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){.architecture-graphic{--dg-bg:#101622;--dg-panel:#172336;--dg-ink:#e5ebf5;--dg-muted:#a8bad2;--dg-core:#203957;--dg-border:#5c7fab;--dg-data:#8fb7ff;--dg-write:#6dd1c2;--dg-optional:#c2a1e1;--dg-exec:#173e3d;--dg-store:#413725;--dg-service:#352b45}}
.architecture-graphic .dg-background{fill:var(--dg-bg)}.architecture-graphic .dg-group{fill:var(--dg-panel);stroke:var(--dg-border);stroke-width:1.5}.architecture-graphic .dg-box rect{fill:var(--dg-core);stroke:var(--dg-border);stroke-width:1.8}.architecture-graphic .dg-exec rect{fill:var(--dg-exec);stroke:var(--dg-write)}.architecture-graphic .dg-store rect{fill:var(--dg-store)}.architecture-graphic .dg-optional rect{fill:var(--dg-service);stroke:var(--dg-optional);stroke-dasharray:6 4}.architecture-graphic .dg-title{font-size:18px;font-weight:650;fill:var(--dg-ink)}.architecture-graphic .dg-note{font-size:14px;font-weight:450;fill:var(--dg-muted)}.architecture-graphic .dg-edge{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.architecture-graphic .dg-data{stroke:var(--dg-data)}.architecture-graphic .dg-write{stroke:var(--dg-write)}.architecture-graphic .dg-edge.dg-optional{stroke:var(--dg-optional);stroke-dasharray:6 5}.architecture-graphic{--dg-normal:#4f8fe8;--dg-high:#ef7a2d}.architecture-graphic .dg-cell{stroke:none}.architecture-graphic .dg-bar{fill:var(--dg-normal);opacity:.55}.architecture-graphic .dg-bar-high{fill:var(--dg-high);opacity:.9}.architecture-graphic .dg-outline{fill:none;stroke:var(--dg-high);stroke-width:2}.architecture-graphic .dg-tick{font-size:12px;fill:var(--dg-muted)}</style><defs><marker id="architecture-dashboard-flow-zh-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-data)"/></marker><marker id="architecture-dashboard-flow-zh-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-write)"/></marker><marker id="architecture-dashboard-flow-zh-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-optional)"/></marker></defs><rect class="dg-background" width="1080" height="700" rx="12"/><rect class="dg-group" x="300" y="30" width="480" height="570" rx="15"/><polyline class="dg-edge dg-data" points="250,112 290,112 290,125 330,125" marker-end="url(#architecture-dashboard-flow-zh-data)"/><polyline class="dg-edge dg-data" points="250,285 290,285 290,235 330,235" marker-end="url(#architecture-dashboard-flow-zh-data)"/><polyline class="dg-edge dg-data" points="290,285 290,345 330,345" marker-end="url(#architecture-dashboard-flow-zh-data)"/><polyline class="dg-edge dg-data" points="830,112 790,112 790,125 750,125" marker-end="url(#architecture-dashboard-flow-zh-data)"/><polyline class="dg-edge dg-optional" points="750,235 790,235 790,277 830,277" marker-end="url(#architecture-dashboard-flow-zh-optional)"/><polyline class="dg-edge dg-write" points="750,345 800,345 800,442 830,442" marker-end="url(#architecture-dashboard-flow-zh-write)"/><g class="dg-box dg-core"><rect x="20" y="70" width="230" height="85" rx="10"/><text class="dg-title" x="135.0" y="107.5" text-anchor="middle">Prometheus</text><text class="dg-note" x="135.0" y="132.5" text-anchor="middle">使用量 · Requests · Limits</text></g><g class="dg-box dg-exec"><rect x="20" y="235" width="230" height="100" rx="10"/><text class="dg-title" x="135.0" y="280.0" text-anchor="middle">Kubernetes</text><text class="dg-note" x="135.0" y="305.0" text-anchor="middle">Operator 只读上报</text></g><text class="dg-note" x="135" y="365" text-anchor="middle">Pod 模板 · 副本数 · Pod 列表</text><text class="dg-title" x="320" y="59" text-anchor="start">模块资源分析 · 只读</text><g class="dg-box dg-core"><rect x="330" y="85" width="420" height="80" rx="10"/><text class="dg-title" x="540.0" y="120.0" text-anchor="middle">百分位与持续使用量</text><text class="dg-note" x="540.0" y="145.0" text-anchor="middle">P90 · P95 · P99，平台对原始点计算</text></g><g class="dg-box dg-core"><rect x="330" y="195" width="420" height="80" rx="10"/><text class="dg-title" x="540.0" y="230.0" text-anchor="middle">② 调整单 Pod 配置</text><text class="dg-note" x="540.0" y="255.0" text-anchor="middle">副本数不变：Requests · Limits</text></g><g class="dg-box dg-core"><rect x="330" y="305" width="420" height="80" rx="10"/><text class="dg-title" x="540.0" y="340.0" text-anchor="middle">① 调整副本数</text><text class="dg-note" x="540.0" y="365.0" text-anchor="middle">Pod 配置不变：CPU · 内存取较大者</text></g><g class="dg-box dg-core"><rect x="330" y="415" width="420" height="80" rx="10"/><text class="dg-title" x="540.0" y="450.0" text-anchor="middle">常态与高负载时段</text><text class="dg-note" x="540.0" y="475.0" text-anchor="middle">24 小时 · 副本数 · 实际负载</text></g><g class="dg-box dg-core"><rect x="330" y="520" width="420" height="60" rx="10"/><text class="dg-title" x="540.0" y="545.0" text-anchor="middle">计算依据</text><text class="dg-note" x="540.0" y="570.0" text-anchor="middle">来源 · 单位 · 系数 · 取整</text></g><g class="dg-box dg-core"><rect x="830" y="70" width="220" height="85" rx="10"/><text class="dg-title" x="940.0" y="107.5" text-anchor="middle">模块配置</text><text class="dg-note" x="940.0" y="132.5" text-anchor="middle">系数 · 边界 · 策略</text></g><g class="dg-box dg-optional"><rect x="830" y="235" width="220" height="85" rx="10"/><text class="dg-title" x="940.0" y="272.5" text-anchor="middle">AI 分析与邮件</text><text class="dg-note" x="940.0" y="297.5" text-anchor="middle">点按钮才开始</text></g><g class="dg-box dg-exec"><rect x="830" y="400" width="220" height="85" rx="10"/><text class="dg-title" x="940.0" y="437.5" text-anchor="middle">Operator</text><text class="dg-note" x="940.0" y="462.5" text-anchor="middle">Auto 模式才写副本</text></g><text class="dg-note" x="540" y="650" text-anchor="middle">蓝：数据关系   绿：集群写入   虚线：可选能力</text></svg>