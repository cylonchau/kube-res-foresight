<svg xmlns="http://www.w3.org/2000/svg" class="architecture-graphic" width="1080" height="770" viewBox="0 0 1080 770" role="img" aria-labelledby="architecture-strategy-order-en-title architecture-strategy-order-en-description"><title id="architecture-strategy-order-en-title">The order strategies combine in</title><desc id="architecture-strategy-order-en-description">Bypass and fixed values come first; bounds and pace always come last.</desc><style>.architecture-graphic{--dg-bg:#fbfdff;--dg-panel:#f1f5fb;--dg-ink:#172c4a;--dg-muted:#536781;--dg-core:#e5efff;--dg-border:#87a9de;--dg-data:#416db1;--dg-write:#197d79;--dg-optional:#8762a9;--dg-exec:#e1f5f0;--dg-store:#fff0d5;--dg-service:#f1eafa;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){.architecture-graphic{--dg-bg:#101622;--dg-panel:#172336;--dg-ink:#e5ebf5;--dg-muted:#a8bad2;--dg-core:#203957;--dg-border:#5c7fab;--dg-data:#8fb7ff;--dg-write:#6dd1c2;--dg-optional:#c2a1e1;--dg-exec:#173e3d;--dg-store:#413725;--dg-service:#352b45}}
.architecture-graphic .dg-background{fill:var(--dg-bg)}.architecture-graphic .dg-group{fill:var(--dg-panel);stroke:var(--dg-border);stroke-width:1.5}.architecture-graphic .dg-box rect{fill:var(--dg-core);stroke:var(--dg-border);stroke-width:1.8}.architecture-graphic .dg-exec rect{fill:var(--dg-exec);stroke:var(--dg-write)}.architecture-graphic .dg-store rect{fill:var(--dg-store)}.architecture-graphic .dg-optional rect{fill:var(--dg-service);stroke:var(--dg-optional);stroke-dasharray:6 4}.architecture-graphic .dg-title{font-size:18px;font-weight:650;fill:var(--dg-ink)}.architecture-graphic .dg-note{font-size:14px;font-weight:450;fill:var(--dg-muted)}.architecture-graphic .dg-edge{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.architecture-graphic .dg-data{stroke:var(--dg-data)}.architecture-graphic .dg-write{stroke:var(--dg-write)}.architecture-graphic .dg-edge.dg-optional{stroke:var(--dg-optional);stroke-dasharray:6 5}.architecture-graphic{--dg-normal:#4f8fe8;--dg-high:#ef7a2d}.architecture-graphic .dg-cell{stroke:none}.architecture-graphic .dg-bar{fill:var(--dg-normal);opacity:.55}.architecture-graphic .dg-bar-high{fill:var(--dg-high);opacity:.9}.architecture-graphic .dg-outline{fill:none;stroke:var(--dg-high);stroke-width:2}.architecture-graphic .dg-tick{font-size:12px;fill:var(--dg-muted)}</style><defs><marker id="architecture-strategy-order-en-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-data)"/></marker><marker id="architecture-strategy-order-en-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-write)"/></marker><marker id="architecture-strategy-order-en-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-optional)"/></marker></defs><rect class="dg-background" width="1080" height="770" rx="12"/><polyline class="dg-edge dg-data" points="250,84 250,110" marker-end="url(#architecture-strategy-order-en-data)"/><polyline class="dg-edge dg-data" points="250,174 250,200" marker-end="url(#architecture-strategy-order-en-data)"/><polyline class="dg-edge dg-data" points="250,264 250,290" marker-end="url(#architecture-strategy-order-en-data)"/><polyline class="dg-edge dg-data" points="250,354 250,380" marker-end="url(#architecture-strategy-order-en-data)"/><polyline class="dg-edge dg-data" points="250,444 250,470" marker-end="url(#architecture-strategy-order-en-data)"/><polyline class="dg-edge dg-data" points="250,534 250,560" marker-end="url(#architecture-strategy-order-en-data)"/><polyline class="dg-edge dg-data" points="250,624 250,650" marker-end="url(#architecture-strategy-order-en-data)"/><g class="dg-box dg-exec"><rect x="40" y="20" width="420" height="64" rx="10"/><text class="dg-title" x="250.0" y="58.0" text-anchor="middle">Bypass</text></g><text class="dg-note" x="490" y="58" text-anchor="start">Manual takeover; the module takes no part</text><g class="dg-box dg-exec"><rect x="40" y="110" width="420" height="64" rx="10"/><text class="dg-title" x="250.0" y="148.0" text-anchor="middle">A period that fixes the replicas</text></g><text class="dg-note" x="490" y="148" text-anchor="start">The count is that number for the period</text><g class="dg-box dg-exec"><rect x="40" y="200" width="420" height="64" rx="10"/><text class="dg-title" x="250.0" y="238.0" text-anchor="middle">Fixed replicas</text></g><text class="dg-note" x="490" y="238" text-anchor="start">A constant that forecasts and triggers do not change</text><g class="dg-box dg-core"><rect x="40" y="290" width="420" height="64" rx="10"/><text class="dg-title" x="250.0" y="328.0" text-anchor="middle">Forecast (or the fallback)</text></g><text class="dg-note" x="490" y="328" text-anchor="start">The base value of the replicas</text><g class="dg-box dg-core"><rect x="40" y="380" width="420" height="64" rx="10"/><text class="dg-title" x="250.0" y="418.0" text-anchor="middle">Metric triggers</text></g><text class="dg-note" x="490" y="418" text-anchor="start">Set &gt; scale out &gt; scale in</text><g class="dg-box dg-core"><rect x="40" y="470" width="420" height="64" rx="10"/><text class="dg-title" x="250.0" y="508.0" text-anchor="middle">A period with at least / at most</text></g><text class="dg-note" x="490" y="508" text-anchor="start">Raise or cap</text><g class="dg-box dg-core"><rect x="40" y="560" width="420" height="64" rx="10"/><text class="dg-title" x="250.0" y="598.0" text-anchor="middle">Bounds</text></g><text class="dg-note" x="490" y="598" text-anchor="start">Least and most replicas, always last</text><g class="dg-box dg-core"><rect x="40" y="650" width="420" height="64" rx="10"/><text class="dg-title" x="250.0" y="688.0" text-anchor="middle">Pace</text></g><text class="dg-note" x="490" y="688" text-anchor="start">Step and cooldown of one action</text><text class="dg-note" x="540" y="755" text-anchor="middle">The green steps are values the administrator fixed; later strategies do not change them</text></svg>