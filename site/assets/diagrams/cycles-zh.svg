<svg xmlns="http://www.w3.org/2000/svg" class="architecture-graphic" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="architecture-cycles-zh-title architecture-cycles-zh-description"><title id="architecture-cycles-zh-title">预测与反馈循环</title><desc id="architecture-cycles-zh-description">预测周期、实测回填与按需刷新分别运行。</desc><style>.architecture-graphic{--dg-bg:#fbfdff;--dg-panel:#f1f5fb;--dg-ink:#172c4a;--dg-muted:#536781;--dg-core:#e5efff;--dg-border:#87a9de;--dg-data:#416db1;--dg-write:#197d79;--dg-optional:#8762a9;--dg-exec:#e1f5f0;--dg-store:#fff0d5;--dg-service:#f1eafa;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){.architecture-graphic{--dg-bg:#101622;--dg-panel:#172336;--dg-ink:#e5ebf5;--dg-muted:#a8bad2;--dg-core:#203957;--dg-border:#5c7fab;--dg-data:#8fb7ff;--dg-write:#6dd1c2;--dg-optional:#c2a1e1;--dg-exec:#173e3d;--dg-store:#413725;--dg-service:#352b45}}
.architecture-graphic .dg-background{fill:var(--dg-bg)}.architecture-graphic .dg-group{fill:var(--dg-panel);stroke:var(--dg-border);stroke-width:1.5}.architecture-graphic .dg-box rect{fill:var(--dg-core);stroke:var(--dg-border);stroke-width:1.8}.architecture-graphic .dg-exec rect{fill:var(--dg-exec);stroke:var(--dg-write)}.architecture-graphic .dg-store rect{fill:var(--dg-store)}.architecture-graphic .dg-optional rect{fill:var(--dg-service);stroke:var(--dg-optional);stroke-dasharray:6 4}.architecture-graphic .dg-title{font-size:18px;font-weight:650;fill:var(--dg-ink)}.architecture-graphic .dg-note{font-size:14px;font-weight:450;fill:var(--dg-muted)}.architecture-graphic .dg-edge{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.architecture-graphic .dg-data{stroke:var(--dg-data)}.architecture-graphic .dg-write{stroke:var(--dg-write)}.architecture-graphic .dg-edge.dg-optional{stroke:var(--dg-optional);stroke-dasharray:6 5}</style><defs><marker id="architecture-cycles-zh-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-data)"/></marker><marker id="architecture-cycles-zh-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-write)"/></marker><marker id="architecture-cycles-zh-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--dg-optional)"/></marker></defs><rect class="dg-background" width="1080" height="700" rx="12"/><rect class="dg-group" x="20" y="20" width="1040" height="190" rx="15"/><rect class="dg-group" x="20" y="250" width="1040" height="190" rx="15"/><rect class="dg-group" x="20" y="480" width="1040" height="190" rx="15"/><polyline class="dg-edge dg-data" points="260,132 310,132" marker-end="url(#architecture-cycles-zh-data)"/><polyline class="dg-edge dg-data" points="515,132 565,132" marker-end="url(#architecture-cycles-zh-data)"/><polyline class="dg-edge dg-data" points="770,132 820,132" marker-end="url(#architecture-cycles-zh-data)"/><polyline class="dg-edge dg-data" points="260,362 310,362" marker-end="url(#architecture-cycles-zh-data)"/><polyline class="dg-edge dg-data" points="515,362 565,362" marker-end="url(#architecture-cycles-zh-data)"/><polyline class="dg-edge dg-data" points="770,362 820,362" marker-end="url(#architecture-cycles-zh-data)"/><polyline class="dg-edge dg-data" points="260,592 310,592" marker-end="url(#architecture-cycles-zh-data)"/><polyline class="dg-edge dg-data" points="515,592 565,592" marker-end="url(#architecture-cycles-zh-data)"/><polyline class="dg-edge dg-data" points="770,592 820,592" marker-end="url(#architecture-cycles-zh-data)"/><text class="dg-title" x="40" y="49" text-anchor="start">① 预测周期 · 按模块间隔运行</text><g class="dg-box dg-core"><rect x="55" y="95" width="205" height="75" rx="10"/><text class="dg-title" x="157.5" y="127.5" text-anchor="middle">采集</text><text class="dg-note" x="157.5" y="152.5" text-anchor="middle">最新与历史指标</text></g><g class="dg-box dg-core"><rect x="310" y="95" width="205" height="75" rx="10"/><text class="dg-title" x="412.5" y="127.5" text-anchor="middle">预测</text><text class="dg-note" x="412.5" y="152.5" text-anchor="middle">所选算法与模型</text></g><g class="dg-box dg-core"><rect x="565" y="95" width="205" height="75" rx="10"/><text class="dg-title" x="667.5" y="127.5" text-anchor="middle">形成建议</text><text class="dg-note" x="667.5" y="152.5" text-anchor="middle">共识与保护</text></g><g class="dg-box dg-core"><rect x="820" y="95" width="205" height="75" rx="10"/><text class="dg-title" x="922.5" y="127.5" text-anchor="middle">保存快照</text><text class="dg-note" x="922.5" y="152.5" text-anchor="middle">来源与有效期</text></g><text class="dg-title" x="40" y="279" text-anchor="start">② 评估周期 · 实际值到达后</text><g class="dg-box dg-core"><rect x="55" y="325" width="205" height="75" rx="10"/><text class="dg-title" x="157.5" y="357.5" text-anchor="middle">实测回填</text><text class="dg-note" x="157.5" y="382.5" text-anchor="middle">对齐预测时间</text></g><g class="dg-box dg-core"><rect x="310" y="325" width="205" height="75" rx="10"/><text class="dg-title" x="412.5" y="357.5" text-anchor="middle">计算误差</text><text class="dg-note" x="412.5" y="382.5" text-anchor="middle">低估与覆盖率</text></g><g class="dg-box dg-core"><rect x="565" y="325" width="205" height="75" rx="10"/><text class="dg-title" x="667.5" y="357.5" text-anchor="middle">评分与排名</text><text class="dg-note" x="667.5" y="382.5" text-anchor="middle">比较候选表现</text></g><g class="dg-box dg-core"><rect x="820" y="325" width="205" height="75" rx="10"/><text class="dg-title" x="922.5" y="357.5" text-anchor="middle">下一轮决策</text><text class="dg-note" x="922.5" y="382.5" text-anchor="middle">采用资格与可信度</text></g><text class="dg-title" x="40" y="509" text-anchor="start">③ 决策刷新 · 两次预测之间跟随最新负载</text><g class="dg-box dg-core"><rect x="55" y="555" width="205" height="75" rx="10"/><text class="dg-title" x="157.5" y="587.5" text-anchor="middle">Operator 轮询</text><text class="dg-note" x="157.5" y="612.5" text-anchor="middle">读取最新决策</text></g><g class="dg-box dg-core"><rect x="310" y="555" width="205" height="75" rx="10"/><text class="dg-title" x="412.5" y="587.5" text-anchor="middle">更新实测样本</text><text class="dg-note" x="412.5" y="612.5" text-anchor="middle">预测仍新则复用</text></g><g class="dg-box dg-core"><rect x="565" y="555" width="205" height="75" rx="10"/><text class="dg-title" x="667.5" y="587.5" text-anchor="middle">重新计算决策</text><text class="dg-note" x="667.5" y="612.5" text-anchor="middle">新负载与原预测</text></g><g class="dg-box dg-core"><rect x="820" y="555" width="205" height="75" rx="10"/><text class="dg-title" x="922.5" y="587.5" text-anchor="middle">Operator 执行</text><text class="dg-note" x="922.5" y="612.5" text-anchor="middle">再检查执行限制</text></g></svg>