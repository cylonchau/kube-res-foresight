name: kube-resource-fcst-core

x-core-environment: &core-environment
  KUBE_RESOURCE_FCST_DATABASE_DRIVER: mysql
  KUBE_RESOURCE_FCST_MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
  KUBE_RESOURCE_FCST_MYSQL_PORT: ${MYSQL_PORT:-3306}
  KUBE_RESOURCE_FCST_MYSQL_DATABASE: ${MYSQL_DATABASE:-kube-resource-fcst}
  KUBE_RESOURCE_FCST_MYSQL_USERNAME: ${MYSQL_USER:-kube-resource-fcst}
  KUBE_RESOURCE_FCST_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/docker/.env}
  KUBE_RESOURCE_FCST_SERVER_JWT_SECRET: ${KUBE_RESOURCE_FCST_JWT_SECRET:?set KUBE_RESOURCE_FCST_JWT_SECRET in deploy/docker/.env}

x-db-hosts: &db-hosts
  - "host.docker.internal:host-gateway"

x-server-image: &server-image
  image: ${KUBE_RESOURCE_FCST_IMAGE:-kube-resource-fcst:local}
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
    target: kube-resource-fcst
    args:
      VERSION: ${KUBE_RESOURCE_FCST_VERSION:-dev}

services:
  # The built-in MySQL service is intentionally disabled. This stack connects
  # to the existing MySQL instance on the Docker host instead.
  # mysql:
  #   image: mysql:8.4
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_DATABASE: kube-resource-fcst
  #     MYSQL_USER: kube-resource-fcst
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  #   volumes:
  #     - mysql-data:/var/lib/mysql

  migrate:
    <<: *server-image
    restart: "no"
    command: ["server", "--config=/etc/kube-resource-fcst/config.yaml", "--sql-driver=mysql", "--migration"]
    environment: *core-environment
    extra_hosts: *db-hosts
    volumes:
      - ./core.config.yaml:/etc/kube-resource-fcst/config.yaml:ro
    networks:
      - core

  server:
    <<: *server-image
    restart: unless-stopped
    command: ["server", "--config=/etc/kube-resource-fcst/config.yaml", "--sql-driver=mysql"]
    environment: *core-environment
    extra_hosts: *db-hosts
    volumes:
      - ./core.config.yaml:/etc/kube-resource-fcst/config.yaml:ro
    ports:
      - "${KUBE_RESOURCE_FCST_SERVER_BIND:-0.0.0.0}:${KUBE_RESOURCE_FCST_SERVER_PORT:-10000}:10000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:10000/ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - core

  job:
    <<: *server-image
    restart: unless-stopped
    command:
      - job
      - --config=/etc/kube-resource-fcst/config.yaml
      - --sql-driver=mysql
      - --max-workers=${KUBE_RESOURCE_FCST_JOB_WORKERS:-10}
      - --poll-interval=${KUBE_RESOURCE_FCST_JOB_POLL_INTERVAL:-100ms}
    environment: *core-environment
    extra_hosts: *db-hosts
    volumes:
      - ./core.config.yaml:/etc/kube-resource-fcst/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - core

networks:
  core:
