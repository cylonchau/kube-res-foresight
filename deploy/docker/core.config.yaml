
app_name: kube-resource-fcst
database_driver: mysql

# Values are overridden by KUBE_RESOURCE_FCST_MYSQL_* in compose.core.yml.
mysql:
  # Inside Docker, host.docker.internal resolves to the Docker host gateway.
  host: host.docker.internal
  port: 3306
  database: kube-resource-fcst
  username: kube-resource-fcst
  password: change-me
  max_open_connection: "100"
  max_idle_connection: "50"

server:
  port: 10000
  jwt_secret: change-me

loggers:
  business:
    enabled: true
    level: info
    format: json
    outputs:
      - type: stdout
  sql:
    enabled: true
    level: warn
    format: json
    outputs:
      - type: stdout
