# Controllable load services of the test bed. Each one is a copy of load-web (see load-web.yaml for how it works): the TOTAL CPU
# demand of the workload is a knob (ConfigMap <name>-load, millicores) shared by its pods, so any of them can be pressed on its own:
#   deploy/testbed/load.sh <name> low|mid|high|spike|<millicores>
# This file also creates the namespace. Apply load-web.yaml for the fourth one.
apiVersion: v1
kind: Namespace
metadata:
  name: forecast-test
---
apiVersion: v1
kind: ConfigMap
metadata: {name: load-api-load, namespace: forecast-test}
data:
  millicores: "150"
---
apiVersion: v1
kind: Service
metadata: {name: load-api, namespace: forecast-test}
spec:
  clusterIP: None
  selector: {app: load-api}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: load-api, namespace: forecast-test}
spec:
  replicas: 2
  selector: {matchLabels: {app: load-api}}
  template:
    metadata: {labels: {app: load-api}}
    spec:
      containers:
        - name: app
          image: curlimages/curl:latest
          imagePullPolicy: IfNotPresent
          resources: {requests: {cpu: 100m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
          volumeMounts: [{name: load, mountPath: /cfg}]
          command: ["/bin/sh", "-c"]
          args:
            - |
              # centiseconds since boot, read without forking (this busybox date has no %N)
              cs() { read u _ < /proc/uptime; echo "${u%.*}${u#*.}"; }
              n=2; tick=0
              while true; do
                # recount the replicas every 10 s
                if [ $(( tick % 10 )) -eq 0 ]; then
                  c=$(nslookup load-api.forecast-test.svc.cluster.local 2>/dev/null | grep -c '^Address.*\.' )
                  c=$(( c - 1 )); [ $c -ge 1 ] && n=$c
                fi
                m=$(cat /cfg/millicores 2>/dev/null); m=${m:-100}
                # this pod's share of the demand, in centiseconds of CPU per second (1 cs = 10 millicores)
                # spread over 10 s (Bresenham) so the share is exact even when it is below one 10 ms step
                k=$(( tick % 10 )); busy=$(( m * (k + 1) / (n * 10) - m * k / (n * 10) )); [ $busy -gt 95 ] && busy=95
                end=$(( $(cs) + busy ))
                while [ "$(cs)" -lt "$end" ]; do :; done
                sleep 0.$(printf '%02d' $(( 100 - busy > 99 ? 99 : 100 - busy )))
                tick=$(( tick + 1 ))
              done
      volumes:
        - name: load
          configMap: {name: load-api-load}
---
