# The credential Kyverno sends to the platform, and the RBAC that lets the Kyverno admission controller read ONLY this Secret.
# Create the Secret from a developer credential that holds only "Admission Recommendations (read)":
#   kubectl -n kyverno create secret generic kube-res-foresight-admission --from-literal=credential='<access key>:<access secret>'
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kube-res-foresight-admission-credential, namespace: kyverno}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kube-res-foresight-admission"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kube-res-foresight-admission-credential, namespace: kyverno}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kube-res-foresight-admission-credential}
subjects:
  - {kind: ServiceAccount, name: kyverno-admission-controller, namespace: kyverno}
