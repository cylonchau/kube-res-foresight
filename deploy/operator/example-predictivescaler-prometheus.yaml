# Example: scale Deployment prod/worker from one existing Prometheus series that already holds the desired replicas
# (for example a recording rule). The query must return exactly one series; aggregate it if it does not.
# A missing, NaN, negative, stale or refused answer freezes the replicas (or applies the fallback, which can raise
# capacity but never lower it). The Adapter (external metrics API) source is not offered: this operator replaces
# HPA/KEDA and does not depend on one.
apiVersion: autoscaling.kubeforecast.io/v1alpha1
kind: PredictiveScaler
metadata:
  name: worker
  namespace: prod
spec:
  scaleTargetRef:
    kind: Deployment
    name: worker
  mode: Observe
  minReplicas: 1
  maxReplicas: 30
  fallbackReplicas: 3
  evaluationInterval: 30s
  decision:
    source: Prometheus
    prometheus:
      url: http://prometheus.monitoring:9090
      query: 'max(kubeforecast:desired_replicas{namespace="prod",deployment="worker"})'
      maxStalenessSeconds: 120
      timeoutSeconds: 5
      # bearerTokenSecretRef:
      #   name: prometheus-token
      #   key: token
