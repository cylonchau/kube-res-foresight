# Example: scale Deployment prod/api from the replicas the kube-resource-fcst platform recommends for module "api".
# Start in Observe mode; switch to Auto only after the status shows the decisions you expect.
# The workload must not also be targeted by an HPA or a KEDA ScaledObject: the operator then does nothing and
# reports a Conflict condition.
apiVersion: v1
kind: Secret
metadata:
  name: kube-resource-fcst-platform
  namespace: prod
type: Opaque
stringData:
  # "<access key>:<access secret>" of a developer credential that holds only the permission
  # "Operator Decisions (read, report)".
  token: "REPLACE_ACCESS_KEY:REPLACE_ACCESS_SECRET"
---
apiVersion: autoscaling.kube-resource-fcst.io/v1alpha1
kind: PredictiveScaler
metadata:
  name: api
  namespace: prod
spec:
  scaleTargetRef:
    kind: Deployment
    name: api
  mode: Observe
  minReplicas: 2
  maxReplicas: 20
  # Used while the platform is unreachable or its decision has expired. It can raise capacity, never lower it.
  fallbackReplicas: 4
  evaluationInterval: 30s
  behavior:
    scaleUp:
      maxStep: 5
      cooldown: 1m
    scaleDown:
      maxStep: 2
      cooldown: 10m
  decision:
    source: PlatformAPI
    platformAPI:
      url: https://kube-resource-fcst.example.com
      module: api
      accessKeySecretRef:
        name: kube-resource-fcst-platform
        key: token
      timeoutSeconds: 5
