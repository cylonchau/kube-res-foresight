# kube-res-foresight-operator: namespace, identity, permissions and the manager Deployment.
# Reference manifests: build and push the "operator" image (deploy/docker/Dockerfile, --target operator), then replace IMAGE.
# The Helm chart in deploy/helm/kube-res-foresight-operator installs the same objects.
# The operator creates no resource of its own in the cluster: it reads the auto modules of the platform and writes the replicas of
# their workloads. Apply deploy/operator/rbac/role.yaml first, create the Secret with the platform credential, and replace PLATFORM_URL.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-res-foresight-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-res-foresight-operator
  namespace: kube-res-foresight-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-res-foresight-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-res-foresight-operator
subjects:
  - kind: ServiceAccount
    name: kube-res-foresight-operator
    namespace: kube-res-foresight-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-res-foresight-operator
  namespace: kube-res-foresight-system
  labels:
    app.kubernetes.io/name: kube-res-foresight-operator
spec:
  # Two replicas are safe: leader election (on by default) lets only one of them scale.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-res-foresight-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-res-foresight-operator
    spec:
      serviceAccountName: kube-res-foresight-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: IMAGE
          # the image is the "operator" target of deploy/docker/Dockerfile: its entrypoint is kube-res-foresight-operator. With the platform image
          # (target kube-res-foresight, the default last stage) the flags below reach the platform command and fail with "unknown flag: --leader-elect":
          # add  command: ["kube-res-foresight", "operator"]  here, or build the operator image.
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            # The platform whose auto modules are scaled (required) and the Secret key holding its credential
            # ("<access key>:<access secret>", only the permission "Operator Decisions (read, report)").
            - --platform-url=PLATFORM_URL
            - --platform-credential-file=/etc/kube-res-foresight/platform/credential
            # These two are the values the operator starts with; the platform's system parameters operator.sync_interval_seconds and
            # operator.decision_cache_ttl_seconds take over once it answers, and are read again from time to time.
            # - --platform-sync-interval=30s
            # What the operator did while the platform could not be reached is kept here and reported when it can (oldest first, each
            # action once): the file is in an emptyDir, so it survives a restart of the container.
            - --report-spool-file=/var/spool/kube-res-foresight-operator/reports.jsonl
            # The inventory, read-only: the nodes, and the workloads of the modules with their Pods and the requests and limits of their containers, for the
            # resource pages of the platform. 0 turns it off (and the read access to nodes and pods in rbac/role.yaml is then not needed).
            - --inventory-interval=5m
            # The cluster this operator is for (P12): the name it is registered under on the platform's clusters page, to which the access key is bound. Leave it out
            # for the platform's default cluster, which is what every operator was for before clusters were registered.
            # - --cluster=prod-east
            # The events of the cluster, read-only (get, list, watch events in rbac/role.yaml), for the platform to say the reason of what happens to nodes and Pods.
            # The namespaces they are read from are set on the platform after the operator has connected. false leaves the operator doing nothing but scaling.
            - --collect-events=true
            # The state changes of the nodes, Pods, Deployments, StatefulSets and HPAs (read-only, with the same get, list and watch the role already gives).
            - --collect-changes=true
            # Looks for workloads that carry the label kube-res-foresight.io/register=true and reports them; lists nothing until the switch of the cluster is on (the clusters page).
            - --register-workloads=true
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: platform-credential
              mountPath: /etc/kube-res-foresight/platform
              readOnly: true
            - name: report-spool
              mountPath: /var/spool/kube-res-foresight-operator
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: report-spool
          emptyDir:
            sizeLimit: 64Mi
        - name: platform-credential
          secret:
            # kubectl -n kube-res-foresight-system create secret generic kube-res-foresight-platform --from-literal=credential='<access key>:<access secret>'
            secretName: kube-res-foresight-platform
