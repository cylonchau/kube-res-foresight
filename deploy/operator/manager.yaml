# kube-resource-fcst-operator: namespace, identity, permissions and the manager Deployment.
# Reference manifests: build and push the "operator" image (deploy/docker/Dockerfile, --target operator), then replace IMAGE.
# The Helm chart in deploy/helm/kube-resource-fcst-operator installs the same objects.
# The operator creates no resource of its own in the cluster: it reads the auto modules of the platform and writes the replicas of
# their workloads. Apply deploy/operator/rbac/role.yaml first, create the Secret with the platform credential, and replace PLATFORM_URL.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-resource-fcst-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-resource-fcst-operator
  namespace: kube-resource-fcst-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-resource-fcst-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-resource-fcst-operator
subjects:
  - kind: ServiceAccount
    name: kube-resource-fcst-operator
    namespace: kube-resource-fcst-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-resource-fcst-operator
  namespace: kube-resource-fcst-system
  labels:
    app.kubernetes.io/name: kube-resource-fcst-operator
spec:
  # Two replicas are safe: leader election (on by default) lets only one of them scale.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-resource-fcst-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-resource-fcst-operator
    spec:
      serviceAccountName: kube-resource-fcst-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: IMAGE
          # the image is the "operator" target of deploy/docker/Dockerfile: its entrypoint is kube-resource-fcst-operator
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            # The platform whose auto modules are scaled (required) and the Secret key holding its credential
            # ("<access key>:<access secret>", only the permission "Operator Decisions (read, report)").
            - --platform-url=PLATFORM_URL
            - --platform-credential-file=/etc/kube-resource-fcst/platform/credential
            # These two are the values the operator starts with; the platform's system parameters operator.sync_interval_seconds and
            # operator.decision_cache_ttl_seconds take over once it answers, and are read again from time to time.
            # - --platform-sync-interval=30s
            # What the operator did while the platform could not be reached is kept here and reported when it can (oldest first, each
            # action once): the file is in an emptyDir, so it survives a restart of the container.
            - --report-spool-file=/var/spool/kube-resource-fcst-operator/reports.jsonl
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: platform-credential
              mountPath: /etc/kube-resource-fcst/platform
              readOnly: true
            - name: report-spool
              mountPath: /var/spool/kube-resource-fcst-operator
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: report-spool
          emptyDir:
            sizeLimit: 64Mi
        - name: platform-credential
          secret:
            # kubectl -n kube-resource-fcst-system create secret generic kube-resource-fcst-platform --from-literal=credential='<access key>:<access secret>'
            secretName: kube-resource-fcst-platform
