# Example: let the operator scale StatefulSet prod/queue-consumer (Auto mode) from the platform module "queue-consumer",
# with a private CA for the platform certificate.
# Prerequisites, in this order:
#   1. the same PredictiveScaler ran in Observe mode and its status showed the decisions you expect;
#   2. an administrator opened the system setting forecast.allow_auto_mode on the platform;
#   3. no HPA and no KEDA ScaledObject targets the StatefulSet (the operator then reports a Conflict and does nothing).
apiVersion: v1
kind: Secret
metadata:
  name: kube-resource-fcst-ca
  namespace: prod
type: Opaque
stringData:
  # the PEM bundle that signed the certificate of the platform
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_THE_PEM_OF_YOUR_CA
    -----END CERTIFICATE-----
---
apiVersion: autoscaling.kube-resource-fcst.io/v1alpha1
kind: PredictiveScaler
metadata:
  name: queue-consumer
  namespace: prod
spec:
  scaleTargetRef:
    kind: StatefulSet
    name: queue-consumer
  mode: Auto
  minReplicas: 3
  maxReplicas: 30
  fallbackReplicas: 6
  evaluationInterval: 30s
  behavior:
    scaleUp:
      maxStep: 4
      cooldown: 2m
    scaleDown:
      maxStep: 1
      cooldown: 15m
  decision:
    source: PlatformAPI
    platformAPI:
      url: https://kube-resource-fcst.example.com
      module: queue-consumer
      accessKeySecretRef:
        name: kube-resource-fcst-platform # see example-predictivescaler.yaml
        key: token
      caBundleSecretRef:
        name: kube-resource-fcst-ca
        key: ca.crt
      timeoutSeconds: 5
