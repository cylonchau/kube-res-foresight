# Scrape target for the operator business metrics (kube_res_foresight_operator_*). The controller-runtime metrics
# endpoint serves them next to its own on the manager's metrics port.
apiVersion: v1
kind: Service
metadata:
  name: kube-res-foresight-operator-metrics
  namespace: kube-res-foresight-system
  labels:
    app.kubernetes.io/name: kube-res-foresight-operator
spec:
  selector:
    app.kubernetes.io/name: kube-res-foresight-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
# Requires the Prometheus Operator CRDs. Without them, scrape the Service above with a plain scrape config.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-res-foresight-operator
  namespace: kube-res-foresight-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-res-foresight-operator
  endpoints:
    - port: metrics
      interval: 30s
