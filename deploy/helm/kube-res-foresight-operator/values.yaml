# Values of the kube-res-foresight-operator chart. It has not been installed in a real cluster yet.

# The operator image (deploy/docker/Dockerfile, target "operator"). There is no public image: build and push one.
image:
  repository: "" # required, for example registry.example.com/kube-res-foresight-operator
  tag: "" # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Two replicas are safe: leader election lets only one of them scale.
replicaCount: 2

nameOverride: ""
fullnameOverride: ""

operator:
  # Leader election must stay on while replicaCount > 1.
  leaderElect: true
  # Watch only this namespace; empty watches every namespace.
  watchNamespace: ""
  # Extra arguments of the operator command.
  extraArgs: []
  # Empty runs the entrypoint of the operator image (target "operator"). If the image is the platform image (it has no operator entrypoint, so
  # "unknown flag: --leader-elect" and the usage of kube-res-foresight is all it prints), set it to ["kube-res-foresight", "operator"].
  command: []

# The platform (required). The operator reads its auto modules (namespace, workload, bounds, fallback, pace) and scales their workloads
# through the scale subresource: the module is the only configuration, and the operator creates nothing else in the cluster.
platform:
  url: "" # required, for example https://kube-res-foresight.example.com
  # The value the operator starts with. The platform's system parameter operator.sync_interval_seconds takes over once it answers and is
  # read again from time to time (so are the request timeout and the cache lifetimes: operator.* on the platform's system parameter page).
  syncInterval: 30s
  # Secret holding the developer credential "<access key>:<access secret>" (only "Operator Decisions (read, report)").
  credentialSecret:
    name: ""
    key: credential
  # Optional Secret holding a PEM CA bundle of the platform certificate.
  caSecret:
    name: ""
    key: ca.crt

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Besides the replicas, let the operator write the CPU and memory Requests, the Limits a module manages and the Node Selector of the node pool the platform recommends on the Pod template
# of a module in auto mode. A change of the template rolls the Pods of the workload. Off, the operator writes the replicas and nothing else, and its role has no write on the workloads.
adjustPodSpec:
  enabled: false

# The inventory (read-only): the operator reads the nodes, and the workloads of the platform modules with their Pods and the requests and limits of their
# containers, and reports them to the platform for its resource pages. It needs read access to nodes and pods (see the ClusterRole). Turn it off to give
# the operator no read access beyond what scaling needs.
inventory:
  enabled: true
  # how often the cluster is read; a report is made when something that is configuration changed, and at least once an hour
  interval: 5m

# The Cluster Agent (P12): which cluster this operator is for, and whether it reads the events of the cluster (read-only) for the platform.
clusterAgent:
  # The name of the cluster as registered on the platform's clusters page; the access key (platform.credentialSecret) must be bound to it there. Empty is
  # the platform's default cluster, which is what an operator was for before clusters were registered.
  cluster: ""
  # Read the events of the cluster (the role then gets get, list and watch on events). The namespaces they are read from are set on the platform. Off leaves
  # the operator doing nothing but scaling (and the inventory above).
  collectEvents: true
  # Watch the nodes, Pods, Deployments, StatefulSets and HPAs and report their state changes (read-only; the role needs get, list and watch on them, which the inventory
  # rule and the rules for scaling already give). Off leaves the operator doing nothing but scaling.
  collectChanges: true
  # Look for the Deployments, StatefulSets and DaemonSets that carry the label kube-res-foresight.io/register=true and report them to the platform, which makes them modules
  # (switched off) when the switch of the cluster is on (the clusters page). It lists nothing while that switch is off; the label is selected on by the API server, so only
  # labelled workloads are read. The role needs get, list and watch on the three kinds of workload.
  registerWorkloads: true

rbac:
  # Create the ClusterRole and its binding. Turn it off only when you bind a role of your own.
  create: true

metrics:
  port: 8080
  service:
    enabled: true
  # Needs the Prometheus Operator CRDs.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

probes:
  port: 8081

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
