{{- if not .Values.image.repository }}
{{- fail "image.repository is required: build the operator image (deploy/docker/Dockerfile, target operator), push it and set image.repository" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-resource-fcst-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-resource-fcst-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-resource-fcst-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-resource-fcst-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kube-resource-fcst-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.operator.leaderElect }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:{{ .Values.probes.port }}
            {{- with .Values.operator.watchNamespace }}
            - --namespace={{ . }}
            {{- end }}
            - --platform-url={{ required "platform.url is required: the operator scales the workloads of the platform's modules" .Values.platform.url }}
            - --platform-credential-file=/etc/kube-resource-fcst/platform/{{ .Values.platform.credentialSecret.key }}
            - --platform-sync-interval={{ .Values.platform.syncInterval }}
            {{- if .Values.platform.caSecret.name }}
            - --platform-ca-file=/etc/kube-resource-fcst/platform-ca/{{ .Values.platform.caSecret.key }}
            {{- end }}
            {{- range .Values.operator.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            - name: probes
              containerPort: {{ .Values.probes.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: platform-credential
              mountPath: /etc/kube-resource-fcst/platform
              readOnly: true
            {{- if .Values.platform.caSecret.name }}
            - name: platform-ca
              mountPath: /etc/kube-resource-fcst/platform-ca
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: platform-credential
          secret:
            secretName: {{ required "platform.credentialSecret.name is required with platform.url" .Values.platform.credentialSecret.name }}
        {{- if .Values.platform.caSecret.name }}
        - name: platform-ca
          secret:
            secretName: {{ .Values.platform.caSecret.name }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
