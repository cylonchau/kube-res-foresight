{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-resource-fcst-operator.fullname" . }}
  labels:
    {{- include "kube-resource-fcst-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # the platform and Prometheus credentials are read from the Secrets a PredictiveScaler names
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]
  # read only: to refuse a workload that an HPA or a KEDA ScaledObject already controls
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling.kube-resource-fcst.io"]
    resources: ["predictivescalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling.kube-resource-fcst.io"]
    resources: ["predictivescalers/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-resource-fcst-operator.fullname" . }}
  labels:
    {{- include "kube-resource-fcst-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-resource-fcst-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-resource-fcst-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
