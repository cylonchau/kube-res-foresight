apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kube-res-foresight.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-res-foresight.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: check
      image: {{ include "kube-res-foresight.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # the platform answers /readyz and serves the metrics
      command: ["/bin/sh", "-c"]
      args:
        - |
          wget -q -O- http://{{ include "kube-res-foresight.fullname" . }}:{{ .Values.metrics.port }}/readyz &&
          wget -q -O- http://{{ include "kube-res-foresight.fullname" . }}:{{ .Values.metrics.port }}/metrics | grep -q '^kube_res_foresight_forecast_metrics_error'
      resources:
        {{- toYaml .Values.migration.resources | nindent 8 }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
