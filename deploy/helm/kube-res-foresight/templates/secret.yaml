{{- if not .Values.secrets.existingSecret }}
{{- /* generated once: an upgrade reads the keys of the Secret that is there, so they do not change */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "kube-res-foresight.fullname" .) }}
{{- $jwt := .Values.secrets.jwtSecret }}
{{- $key := .Values.secrets.secretKey }}
{{- $dbpass := .Values.secrets.databasePassword }}
{{- if $existing }}
{{- if not $jwt }}{{ $jwt = index $existing.data .Values.secrets.keys.jwtSecret | b64dec }}{{ end }}
{{- if not $key }}{{ $key = index $existing.data .Values.secrets.keys.secretKey | b64dec }}{{ end }}
{{- end }}
{{- if not $jwt }}{{ $jwt = randAlphaNum 48 }}{{ end }}
{{- if not $key }}{{ $key = randAlphaNum 48 }}{{ end }}
{{- if lt (len $key) 32 }}{{ fail "secrets.secretKey must be at least 32 characters" }}{{ end }}
{{- $data := dict .Values.secrets.keys.jwtSecret $jwt .Values.secrets.keys.secretKey $key .Values.secrets.keys.databasePassword $dbpass }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-res-foresight.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-res-foresight.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- toYaml $data | nindent 2 }}
{{- if and .Values.migration.enabled (eq (include "kube-res-foresight.migrationMode" .) "job") }}
---
# the same keys for the migration hook, which runs before the Secret above exists on a first install
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-res-foresight.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-res-foresight.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- toYaml $data | nindent 2 }}
{{- end }}
{{- end }}
